    <!-- =========================================================

    <style>

        * {

        }


        body {

            margin: 0;

            padding: 20px;

            font-family:

            align-items: center;

        }


        .container {

            width: 100%;

            max-width: 850px;

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px

            text-align: center;

        }


        h1 {

            margin-top: 0;

            color: #0077b6;

            font-size: 32px;

        }


        .subtitle {

            color: #555;

            margin-bottom: 25px;

        }


        /* =====================================================
           STATUS
           ===================================================== */

        #status {

            padding: 15px;

            margin: 20px 0;

            border-radius: 10px;

            font-weight: bold;

        }


        #status.loading {

            background: #d9edf7;

        #status.success {

            border: 2px dashed #0077b6;

            border-radius: 15px;

        }


        input[type="file"] {

            width: 100%;

            max-width: 500px;

            padding: 10px;

            cursor: pointer;

        }


        /* =====================================================
           PREVIEW
           ===================================================== */

        #preview {

            display: none;

            max-width: 100%;

            max-height: 400px;

            margin: 25px auto;

            border-radius: 15px;

            box-shadow:
                0 5px 20px

        /* =====================================================
           BUTTON
           ===================================================== */

        button {

            width: 100%;

            max-width: 450px;

            padding: 16px 25px;

            background: #0077b6;

            transition: 0.2s;

        /* =====================================================
           RESULT
           ===================================================== */

        #result {

        #probabilityList {

        .bar-container {

            width: 100%;

            border-radius: 10px;

            overflow: hidden;

        .bar {

            height: 100%;

        /* =====================================================

        .model-info {

        /* =====================================================

        /* =====================================================

<body>


<div class="container">


    <!-- =====================================================
         TITLE
         ===================================================== -->

    <h1>
        Coral Species Classification AI
    </h1>


    <div class="subtitle">
        AI-powered coral species identification
    </div>


    <!-- =====================================================
         STATUS
         ===================================================== -->

    <div
        id="status"
        class="loading"
    >
        Loading AI model...
    </div>


    <!-- =====================================================
         IMAGE UPLOAD
         ===================================================== -->

    <div class="upload-box">

        <h3>
            Upload Coral Image
        </h3>

        <input
            type="file"

         PREDICT
         ===================================================== -->

    <button
        id="predictButton"
        disabled
    >

    </button>


    <!-- =====================================================
         RESULT
         ===================================================== -->

    <div id="result">
        Upload a coral image to begin.
    </div>


    <!-- =====================================================
         PROBABILITY RESULTS
         ===================================================== -->

    <div id="probabilityList"></div>


    <!-- =====================================================
         MODEL INFORMATION
         ===================================================== -->

    <div class="model-info">

        <div>
            <strong>Model:</strong>
            model1.tflite
        </div>

        <div>
            <strong>Framework:</strong>
            TensorFlow Lite
        </div>

        <div>
            <strong>Input:</strong>
            256 × 256 × 3
        </div>

        <div>
            <strong>Inference:</strong>
            Client-side
        </div>

        <div>
            <strong>Confidence Threshold:</strong>
            50%
        </div>

    </div>


    <div class="footer">
        Coral Species Classification System
    </div>


</div>



<script>

/* =============================================================
   CONFIGURATION
   ============================================================= */


/*
    TFLite model
*/

const MODEL_URL =
    "./model1.tflite";


/*
    Class labels
*/

const LABELS_URL =
    "./labels.json";


/*
    Confidence threshold

    0.50 = 50%
*/

const CONFIDENCE_THRESHOLD =
    0.50;


/*
    Number of top predictions
*/

const TOP_RESULTS =
    5;


/*
    Default CNN input size
*/

const DEFAULT_HEIGHT =
    256;


const DEFAULT_WIDTH =
    256;



/* =============================================================
   GLOBAL VARIABLES
   ============================================================= */

let model = null;

let labels = [];

let modelReady = false;

let inputHeight =
    DEFAULT_HEIGHT;

let inputWidth =
    DEFAULT_WIDTH;



/* =============================================================
   HTML ELEMENTS
   ============================================================= */

const statusElement =
    document.getElementById(
        "status"
    );


const imageInput =
    document.getElementById(
        "imageInput"
    );


const preview =
    document.getElementById(
        "preview"
    );


const predictButton =
    document.getElementById(
        "predictButton"
    );


const result =
    document.getElementById(
        "result"
    );


const probabilityList =
    document.getElementById(
        "probabilityList"
    );



/* =============================================================
   STATUS
   ============================================================= */

function setStatus(
    message,
    type
) {

    statusElement.textContent =
        message;

    statusElement.className =
        type;

}



/* =============================================================
   LOAD LABELS
   ============================================================= */

async function loadLabels() {

    console.log(
        "Loading labels:",
        LABELS_URL
    );


    const response =
        await fetch(
            LABELS_URL,
            {
                cache: "no-cache"
            }
        );


    if (!response.ok) {

        throw new Error(
            "Unable to load labels.json. " +
            "HTTP status: " +
            response.status
        );

    }


    const data =
        await response.json();


    /*
        Format:

        [
            "ACER",
            "APAL",
            ...
        ]
    */

    if (
        Array.isArray(data)
    ) {

        labels = data;

    }


    /*
        Format:

        {
            "labels": [
                "ACER",
                "APAL"
            ]
        }
    */

    else if (
        data &&
        Array.isArray(
            data.labels
        )
    ) {

        labels =
            data.labels;

    }


    /*
        Format:

        {
            "0": "ACER",
            "1": "APAL"
        }
    */

    else if (
        data &&
        typeof data === "object"
    ) {

        labels =
            Object.keys(data)
                .sort(
                    function(a, b) {

                        return (
                            Number(a) -
                            Number(b)
                        );

                    }
                )
                .map(
                    function(key) {

                        return data[key];

                    }
                );

    }

    else {

        throw new Error(
            "Unsupported labels.json format."
        );

    }


    if (
        labels.length === 0
    ) {

        throw new Error(
            "labels.json contains no labels."
        );

    }


    console.log(
        "Labels loaded:",
        labels
    );

}



/* =============================================================
   DETERMINE INPUT SIZE
   ============================================================= */

function determineInputSize() {

    /*
        Start with your known
        256 × 256 input.
    */

    inputHeight =
        DEFAULT_HEIGHT;

    inputWidth =
        DEFAULT_WIDTH;


    /*
        Some TFLite versions expose
        inputShape.
    */

    if (
        model &&
        model.inputShape &&
        model.inputShape.length >= 4
    ) {

        const shape =
            model.inputShape;


        const h =
            shape[
                shape.length - 3
            ];


        const w =
            shape[
                shape.length - 2
            ];


        if (
            Number.isFinite(h) &&
            h > 0
        ) {

            inputHeight =
                h;

        }


        if (
            Number.isFinite(w) &&
            w > 0
        ) {

            inputWidth =
                w;

        }

    }


    /*
        Alternative API.
    */

    else if (
        model &&
        model.inputs &&
        model.inputs[0] &&
        model.inputs[0].shape
    ) {

        const shape =
            model.inputs[0].shape;


        if (
            shape.length >= 4
        ) {

            if (
                Number.isFinite(
                    shape[1]
                )
            ) {

                inputHeight =
                    shape[1];

            }


            if (
                Number.isFinite(
                    shape[2]
                )
            ) {

                inputWidth =
                    shape[2];

            }

        }

    }


    console.log(
        "Input size:",
        inputHeight +
        " × " +
        inputWidth
    );

}



/* =============================================================
   LOAD MODEL
   ============================================================= */

async function loadModel() {

    try {

        setStatus(
            "Initializing TensorFlow.js...",
            "loading"
        );


        /*
            Check TensorFlow.js.
        */

        if (
            typeof tf ===
            "undefined"
        ) {

            throw new Error(
                "TensorFlow.js did not load."
            );

        }


        console.log(
            "TensorFlow.js version:",
            tf.version.tfjs
        );


        /*
            Use CPU backend.
        */

        await tf.setBackend(
            "cpu"
        );


        await tf.ready();


        console.log(
            "TensorFlow.js backend:",
            tf.getBackend()
        );


        setStatus(
            "Loading TensorFlow Lite model...",
            "loading"
        );


        /*
            Check TFLite library.
        */

        if (
            typeof tflite ===
            "undefined"
        ) {

            throw new Error(
                "TensorFlow Lite library did not load."
            );

        }


        if (
            typeof
            tflite.loadTFLiteModel !==
            "function"
        ) {

            throw new Error(
                "tflite.loadTFLiteModel() is unavailable."
            );

        }


        console.log(
            "Loading:",
            MODEL_URL
        );


        /*
            LOAD TFLITE MODEL
        */

        model =
            await tflite.loadTFLiteModel(
                MODEL_URL
            );


        console.log(
            "TFLite model loaded successfully.",
            model
        );


        /*
            Determine input.
        */

        determineInputSize();


        /*
            Load labels.
        */

        setStatus(
            "Loading coral species labels...",
            "loading"
        );


        await loadLabels();


        /*
            Verify labels.
        */

        console.log(
            "Number of classes:",
            labels.length
        );


        /*
            Ready.
        */

        modelReady = true;


        setStatus(
            "✓ AI Model Loaded Successfully",
            "success"
        );


        predictButton.disabled =
            false;


        result.innerHTML =
            "Upload a coral image to begin.";


        console.log(
            "======================================"
        );

        console.log(
            "CORAL CLASSIFIER READY"
        );

        console.log(
            "TensorFlow.js:",
            tf.version.tfjs
        );

        console.log(
            "Backend:",
            tf.getBackend()
        );

        console.log(
            "Model:",
            MODEL_URL
        );

        console.log(
            "Input:",
            inputHeight +
            " × " +
            inputWidth +
            " × 3"
        );

        console.log(
            "Classes:",
            labels.length
        );

        console.log(
            "======================================"
        );

    }

    catch (error) {

        modelReady =
            false;


        console.error(
            "MODEL LOADING ERROR:",
            error
        );


        setStatus(
            "✗ Model Loading Error",
            "error"
        );


        result.innerHTML = `

            <div class="unknown">

                Model Loading Error

            </div>

            <br>

            <b>Error:</b>

            <br>

            ${escapeHTML(
                error.message ||
                String(error)
            )}

        `;


        predictButton.disabled =
            true;

    }

}



/* =============================================================
   IMAGE PREVIEW
   ============================================================= */

imageInput.addEventListener(
    "change",
    function() {

        const file =
            this.files[0];


        if (!file) {

            preview.style.display =
                "none";

            return;

        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            alert(
                "Please select an image."
            );

            this.value = "";

            return;

        }


        /*
            Release previous object URL.
        */

        if (
            preview.dataset.url
        ) {

            URL.revokeObjectURL(
                preview.dataset.url
            );

        }


        const url =
            URL.createObjectURL(
                file
            );


        preview.dataset.url =
            url;


        preview.src =
            url;


        preview.style.display =
            "block";


        result.innerHTML =
            "Image selected. Click PREDICT CORAL SPECIES.";


        probabilityList.innerHTML =
            "";

    }
);



/* =============================================================
   PREDICT BUTTON
   ============================================================= */

predictButton.addEventListener(
    "click",
    async function() {

        if (!modelReady) {

            alert(
                "AI model is not ready."
            );

            return;

        }


        const file =
            imageInput.files[0];


        if (!file) {

            alert(
                "Please upload a coral image first."
            );

            return;

        }


        predictButton.disabled =
            true;


        result.innerHTML =
            "Analyzing coral image...";


        probabilityList.innerHTML =
            "";


        try {

            const image =
                await loadImage(
                    file
                );


            const probabilities =
                await predictImage(
                    image
                );


            displayResults(
                probabilities
            );

        }

        catch (error) {

            console.error(
                "PREDICTION ERROR:",
                error
            );


            result.innerHTML = `

                <div class="unknown">

                    Prediction Error

                </div>

                <br>

                ${escapeHTML(
                    error.message ||
                    String(error)
                )}

            `;

        }

        finally {

            predictButton.disabled =
                false;

        }

    }
);



/* =============================================================
   LOAD IMAGE
   ============================================================= */

function loadImage(file) {

    return new Promise(
        function(resolve, reject) {

            const image =
                new Image();


            const url =
                URL.createObjectURL(
                    file
                );


            image.onload =
                function() {

                    URL.revokeObjectURL(
                        url
                    );


                    resolve(
                        image
                    );

                };


            image.onerror =
                function() {

                    URL.revokeObjectURL(
                        url
                    );


                    reject(
                        new Error(
                            "Unable to read the image."
                        )
                    );

                };


            image.src =
                url;

        }
    );

}



/* =============================================================
   PREDICT IMAGE
   ============================================================= */

async function predictImage(
    image
) {

    let originalTensor =
        null;

    let resizedTensor =
        null;

    let inputTensor =
        null;

    let prediction =
        null;


    try {

        console.log(
            "======================================"
        );

        console.log(
            "STARTING CORAL PREDICTION"
        );

        console.log(
            "======================================"
        );


        /* =====================================================
           STEP 1
           IMAGE → TENSOR
           ===================================================== */

        originalTensor =
            tf.browser.fromPixels(
                image
            );


        console.log(
            "Original image tensor:",
            originalTensor.shape
        );


        console.log(
            "Original dtype:",
            originalTensor.dtype
        );


        /* =====================================================
           STEP 2
           RESIZE
           ===================================================== */

        resizedTensor =
            tf.image.resizeBilinear(
                originalTensor,
                [
                    inputHeight,
                    inputWidth
                ]
            );


        console.log(
            "Resized tensor:",
            resizedTensor.shape
        );


        /* =====================================================
           STEP 3
           FLOAT32
           
           IMPORTANT:
           
           Full TensorFlow.js is loaded above,
           so toFloat() is available.
           ===================================================== */

        inputTensor =
            resizedTensor.toFloat();


        console.log(
            "Float tensor:",
            inputTensor.shape
        );


        console.log(
            "Float dtype:",
            inputTensor.dtype
        );


        /* =====================================================
           STEP 4
           NORMALIZATION
           
           IMPORTANT:
           
           We are NOT dividing by 255 here.

           This assumes the trained CNN/TFLite model
           handles its own rescaling.

           If your model does NOT have internal
           Rescaling(1./255), we can change this later.
           ===================================================== */


        /* =====================================================
           STEP 5
           ADD BATCH DIMENSION
           ===================================================== */

        inputTensor =
            inputTensor.expandDims(
                0
            );


        console.log(
            "Final input tensor:",
            inputTensor.shape
        );


        console.log(
            "Final input dtype:",
            inputTensor.dtype
        );


        /*
            Expected:

            [1, 256, 256, 3]
        */


        /* =====================================================
           STEP 6
           RUN MODEL
           ===================================================== */

        prediction =
            model.predict(
                inputTensor
            );


        console.log(
            "Raw prediction:",
            prediction
        );


        /* =====================================================
           STEP 7
           READ OUTPUT
           ===================================================== */

        let probabilities;


        /*
            Tensor output
        */

        if (
            prediction &&
            typeof prediction.data ===
            "function"
        ) {

            probabilities =
                await prediction.data();

        }


        /*
            Array output
        */

        else if (
            Array.isArray(
                prediction
            )
        ) {

            /*
                First item is a Tensor.
            */

            if (
                prediction[0] &&
                typeof
                prediction[0].data ===
                "function"
            ) {

                probabilities =
                    await prediction[0].data();

            }

            else {

                probabilities =
                    prediction;

            }

        }


        else {

            throw new Error(
                "Unsupported model output format."
            );

        }


        probabilities =
            Array.from(
                probabilities
            );


        console.log(
            "Output length:",
            probabilities.length
        );


        console.log(
            "Output probabilities:",
            probabilities
        );


        return probabilities;

    }

    finally {

        /* =====================================================
           CLEANUP
           ===================================================== */

        if (
            originalTensor &&
            typeof
            originalTensor.dispose ===
            "function"
        ) {

            originalTensor.dispose();

        }


        if (
            resizedTensor &&
            typeof
            resizedTensor.dispose ===
            "function"
        ) {

            resizedTensor.dispose();

        }


        if (
            inputTensor &&
            typeof
            inputTensor.dispose ===
            "function"
        ) {

            inputTensor.dispose();

        }


        /*
            Prediction may be a Tensor.
        */

        if (
            prediction &&
            typeof
            prediction.dispose ===
            "function"
        ) {

            prediction.dispose();

        }


        /*
            Prediction may be an array
            of tensors.
        */

        if (
            Array.isArray(
                prediction
            )
        ) {

            prediction.forEach(
                function(item) {

                    if (
                        item &&
                        typeof
                        item.dispose ===
                        "function"
                    ) {

                        item.dispose();

                    }

                }
            );

        }

    }

}



/* =============================================================
   DISPLAY RESULTS
   ============================================================= */

function displayResults(
    probabilities
) {

    if (
        !probabilities ||
        probabilities.length === 0
    ) {

        throw new Error(
            "The model returned no prediction values."
        );

    }


    /* =========================================================
       FIND MAXIMUM
       ========================================================= */

    let maxIndex =
        0;


    for (
        let i = 1;
        i < probabilities.length;
        i++
    ) {

        if (
            probabilities[i] >
            probabilities[maxIndex]
        ) {

            maxIndex =
                i;

        }

    }


    const maxProbability =
        probabilities[
            maxIndex
        ];


    const confidence =
        maxProbability * 100;


    const predictedLabel =
        labels[
            maxIndex
        ] ||
        "Unknown";


    /* =========================================================
       CONFIDENCE CHECK
       ========================================================= */

    const accepted =
        maxProbability >=
        CONFIDENCE_THRESHOLD;


    /* =========================================================
       RANK PREDICTIONS
       ========================================================= */

    const ranked =
        probabilities
            .map(
                function(
                    probability,
                    index
                ) {

                    return {

                        index:
                            index,

                        probability:
                            probability,

                        label:
                            labels[index] ||
                            "Class " +
                            index

                    };

                }
            )
            .sort(
                function(a, b) {

                    return (
                        b.probability -
                        a.probability
                    );

                }
            );


    /* =========================================================
       MAIN RESULT
       ========================================================= */

    if (accepted) {

        result.innerHTML = `

            <div class="result-title">

                Predicted Coral Species

            </div>


            <div class="species">

                ${escapeHTML(
                    predictedLabel
                )}

            </div>


            <div class="confidence">

                Confidence:

                <b>

                    ${confidence.toFixed(2)}%

                </b>

            </div>


            <div class="accepted">

                ✓ Prediction Accepted

            </div>

        `;

    }

    else {

        result.innerHTML = `

            <div class="result-title">

                Classification Result

            </div>


            <div class="species unknown">

                UNKNOWN

            </div>


            <div class="confidence">

                Highest Confidence:

                <b>

                    ${confidence.toFixed(2)}%

                </b>

            </div>


            <div class="unknown">

                ⚠ Confidence below
                ${(CONFIDENCE_THRESHOLD * 100).toFixed(0)}%
                threshold

            </div>

        `;

    }


    /* =========================================================
       TOP PREDICTIONS
       ========================================================= */

    probabilityList.innerHTML = `

        <h3 class="probability-title">

            Top Predictions

        </h3>

    `;


    ranked
        .slice(
            0,
            Math.min(
                TOP_RESULTS,
                ranked.length
            )
        )
        .forEach(
            function(item) {

                const percentage =
                    item.probability *
                    100;


                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "probability-item";


                row.innerHTML = `

                    <div
                        class="probability-label"
                    >

                        <span>

                            ${escapeHTML(
                                item.label
                            )}

                        </span>


                        <span>

                            ${percentage.toFixed(2)}%

                        </span>

                    </div>


                    <div
                        class="bar-container"
                    >

                        <div
                            class="bar"
                            style="
                                width:
                                ${Math.max(
                                    0,
                                    Math.min(
                                        100,
                                        percentage
                                    )
                                )}%;
                            "
                        ></div>

                    </div>

                `;


                probabilityList.appendChild(
                    row
                );

            }
        );


    console.log(
        "======================================"
    );

    console.log(
        "PREDICTION RESULT"
    );

    console.log(
        "Class:",
        predictedLabel
    );

    console.log(
        "Class index:",
        maxIndex
    );

    console.log(
        "Confidence:",
        confidence.toFixed(2) +
        "%"
    );

    console.log(
        "Accepted:",
        accepted
    );

    console.log(
        "======================================"
    );

}



/* =============================================================
   ESCAPE HTML
   ============================================================= */

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
