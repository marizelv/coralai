<!-- TensorFlow.js Core -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0/dist/tf-core.min.js"></script>

<!-- TensorFlow.js CPU Backend -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu@4.22.0/dist/tf-backend-cpu.min.js"></script>

<!-- TensorFlow Lite Web -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.10/dist/tf-tflite.min.js"></script>

<script>

const MODEL_URL = "./model1.tflite";
const LABELS_URL = "./labels.json";

let model = null;
let labels = [];

const status =
    document.getElementById("status");

const imageInput =
    document.getElementById("imageInput");

const preview =
    document.getElementById("preview");

const predictButton =
    document.getElementById("predictButton");

const result =
    document.getElementById("result");


async function loadModel() {

    try {

        status.innerHTML =
            "Loading AI model...";

        console.log(
            "================================"
        );

        console.log(
            "CORAL TFLITE MODEL"
        );

        console.log(
            "================================"
        );


        /* --------------------------------
           Initialize TensorFlow.js
           -------------------------------- */

        await tf.setBackend("cpu");

        await tf.ready();

        console.log(
            "TensorFlow.js backend:",
            tf.getBackend()
        );


        /* --------------------------------
           Check TFLite file
           -------------------------------- */

        const response =
            await fetch(MODEL_URL);

        console.log(
            "model1.tflite HTTP status:",
            response.status
        );


        if (!response.ok) {

            throw new Error(
                "model1.tflite not found. HTTP " +
                response.status
            );

        }


        /* --------------------------------
           Load TFLite model
           -------------------------------- */

        console.log(
            "Loading TFLite model..."
        );


        model =
            await tflite.loadTFLiteModel(
                MODEL_URL
            );


        console.log(
            "✓ TFLITE MODEL LOADED"
        );


        /* --------------------------------
           Model information
           -------------------------------- */

        console.log(
            "Input shape:",
            model.inputs[0].shape
        );

        console.log(
            "Input dtype:",
            model.inputs[0].dtype
        );

        console.log(
            "Output shape:",
            model.outputs[0].shape
        );

        console.log(
            "Output dtype:",
            model.outputs[0].dtype
        );


        /* --------------------------------
           Load labels
           -------------------------------- */

        const labelResponse =
            await fetch(LABELS_URL);


        if (!labelResponse.ok) {

            throw new Error(
                "labels.json not found. HTTP " +
                labelResponse.status
            );

        }


        labels =
            await labelResponse.json();


        console.log(
            "Labels:",
            labels
        );


        /* --------------------------------
           Check label count
           -------------------------------- */

        console.log(
            "Number of labels:",
            labels.length
        );


        /* --------------------------------
           READY
           -------------------------------- */

        status.innerHTML =
            "✓ AI Model Loaded Successfully";

        status.className =
            "success";


        predictButton.disabled =
            false;


        result.innerHTML =
            "Upload a coral image.";

    }


    catch (error) {

        console.error(
            "================================"
        );

        console.error(
            "TFLITE MODEL ERROR:"
        );

        console.error(error);

        console.error(
            "================================"
        );


        status.innerHTML =
            "✗ Model Loading Error";


        status.className =
            "error";


        result.innerHTML =
            "<b>Model Error:</b><br>" +
            error.message;

    }

}
