<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coral Species Classification AI</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #0077b6;
        }

        #status {
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            background: #fff3cd;
        }

        #status.success {
            background: #d4edda;
            color: #155724;
        }

        #status.error {
            background: #f8d7da;
            color: #721c24;
        }

        input {
            margin: 20px;
        }

        #preview {
            max-width: 400px;
            max-height: 400px;
            display: none;
            margin: 20px auto;
            border-radius: 10px;
        }

        button {
            padding: 15px 30px;
            background: #0077b6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            background: #f1f5f8;
            border-radius: 10px;
        }

        .species {
            font-size: 28px;
            font-weight: bold;
            color: #0077b6;
        }

        .confidence {
            font-size: 20px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Coral Species Classification AI</h1>

    <div id="status">
        Loading AI model...
    </div>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
    >

    <br>

    <img
        id="preview"
        alt="Coral Image"
    >

    <br>

    <button
        id="predictButton"
        disabled
    >
        PREDICT CORAL SPECIES
    </button>

    <div id="result">
        Upload a coral image.
    </div>

</div>


<script>

    /* =====================================================
       MODEL FILES
       ===================================================== */

    const MODEL_URL = "./model.json";
    const LABELS_URL = "./labels.json";


    /* =====================================================
       VARIABLES
       ===================================================== */

    let model = null;
    let labels = [];


    /* =====================================================
       HTML ELEMENTS
       ===================================================== */

    const status =
        document.getElementById("status");

    const imageInput =
        document.getElementById("imageInput");

    const preview =
        document.getElementById("preview");

    const predictButton =
        document.getElementById("predictButton");

    const result =
        document.getElementById("result");


    /* =====================================================
       LOAD MODEL
       ===================================================== */

    async function loadModel() {

        try {

            status.innerHTML =
                "Loading AI model...";


            console.log(
                "Loading:",
                MODEL_URL
            );


            /* Load TensorFlow.js model */

            model =
                await tf.loadLayersModel(
                    MODEL_URL
                );


            console.log(
                "Model loaded successfully."
            );


            /* Load labels */

            const response =
                await fetch(
                    LABELS_URL
                );


            labels =
                await response.json();


            console.log(
                "Labels:",
                labels
            );


            /* Model information */

            console.log(
                "Input shape:",
                model.inputs[0].shape
            );


            console.log(
                "Output shape:",
                model.outputs[0].shape
            );


            /* Ready */

            status.innerHTML =
                "✓ AI Model Loaded Successfully";

            status.className =
                "success";


            predictButton.disabled =
                false;


            result.innerHTML =
                "Upload a coral image.";

        }

        catch (error) {

            console.error(
                "MODEL ERROR:",
                error
            );


            status.innerHTML =
                "✗ Model Loading Error";


            status.className =
                "error";


            result.innerHTML =
                "<b>Error:</b><br>" +
                error.message;

        }

    }


    /* =====================================================
       IMAGE PREVIEW
       ===================================================== */

    imageInput.addEventListener(
        "change",
        function() {

            const file =
                this.files[0];


            if (!file) {
                return;
            }


            const url =
                URL.createObjectURL(file);


            preview.src =
                url;


            preview.style.display =
                "block";

        }
    );


    /* =====================================================
       PREDICT
       ===================================================== */

    predictButton.addEventListener(
        "click",
        async function() {

            const file =
                imageInput.files[0];


            if (!file) {

                alert(
                    "Please upload a coral image."
                );

                return;
            }


            predictButton.disabled =
                true;


            result.innerHTML =
                "Analyzing image...";


            try {

                /* -----------------------------------------
                   Load image
                   ----------------------------------------- */

                const image =
                    await loadImage(file);


                /* -----------------------------------------
                   Convert image to Tensor
                   ----------------------------------------- */

                let tensor =
                    tf.browser.fromPixels(
                        image
                    );


                /* -----------------------------------------
                   Resize to model input
                   ----------------------------------------- */

                const inputShape =
                    model.inputs[0].shape;


                const height =
                    inputShape[1];

                const width =
                    inputShape[2];


                tensor =
                    tf.image.resizeBilinear(
                        tensor,
                        [height, width]
                    );


                /* -----------------------------------------
                   Convert to float
                   ----------------------------------------- */

                tensor =
                    tensor.toFloat();


                /*
                   IMPORTANT:

                   If your CNN already has:

                   Rescaling(1./255)

                   DO NOT divide by 255 here.
                */


                /* -----------------------------------------
                   Add batch dimension
                   ----------------------------------------- */

                tensor =
                    tensor.expandDims(0);


                console.log(
                    "Input tensor:",
                    tensor.shape
                );


                /* -----------------------------------------
                   Prediction
                   ----------------------------------------- */

                const prediction =
                    model.predict(
                        tensor
                    );


                const probabilities =
                    await prediction.data();


                /* -----------------------------------------
                   Find highest probability
                   ----------------------------------------- */

                let maxIndex = 0;


                for (
                    let i = 1;
                    i < probabilities.length;
                    i++
                ) {

                    if (
                        probabilities[i] >
                        probabilities[maxIndex]
                    ) {

                        maxIndex = i;

                    }

                }


                const species =
                    labels[maxIndex] ||
                    "Unknown";


                const confidence =
                    probabilities[maxIndex] *
                    100;


                /* -----------------------------------------
                   Display result
                   ----------------------------------------- */

                result.innerHTML = `

                    <h3>Prediction Result</h3>

                    <div class="species">
                        ${species}
                    </div>

                    <div class="confidence">
                        Confidence:
                        <b>
                            ${confidence.toFixed(2)}%
                        </b>
                    </div>

                `;


                /* -----------------------------------------
                   Clean memory
                   ----------------------------------------- */

                tensor.dispose();
                prediction.dispose();

            }

            catch (error) {

                console.error(
                    "Prediction error:",
                    error
                );


                result.innerHTML =
                    "<b>Prediction Error:</b><br>" +
                    error.message;

            }


            predictButton.disabled =
                false;

        }
    );


    /* =====================================================
       IMAGE LOADER
       ===================================================== */

    function loadImage(file) {

        return new Promise(
            function(resolve, reject) {

                const image =
                    new Image();


                image.onload =
                    function() {

                        resolve(image);

                    };


                image.onerror =
                    function() {

                        reject(
                            new Error(
                                "Unable to load image."
                            )
                        );

                    };


                image.src =
                    URL.createObjectURL(file);

            }
        );

    }


    /* =====================================================
       START MODEL
       ===================================================== */

    loadModel();

</script>

</body>
</html>
