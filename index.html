<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coral Species Classification AI</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .status {
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 8px;
            text-align: center;
            background: #fff3cd;
            color: #856404;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .upload-section {
            text-align: center;
            border: 2px dashed #ccc;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        #preview {
            display: none;
            max-width: 100%;
            max-height: 450px;
            margin: 20px auto;
            border-radius: 12px;
        }

        .button-container {
            text-align: center;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            background: #0077b6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #005f8f;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            background: #f7f9fb;
            border-radius: 12px;
        }

        .result-title {
            text-align: center;
            color: #666;
        }

        .species {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin: 15px 0;
        }

        .confidence {
            text-align: center;
            font-size: 20px;
        }

        .top3 {
            margin-top: 25px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .prediction-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .error-box {
            padding: 15px;
            background: #fff0f0;
            border: 1px solid #e0aaaa;
            border-radius: 8px;
            color: #8a1c1c;
            word-break: break-word;
        }

        .model-info {
            margin-top: 20px;
            padding: 15px;
            background: #eef6fb;
            border-radius: 10px;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .species {
                font-size: 23px;
            }

            .prediction-row {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <h1>Coral Species Classification AI</h1>

    <div class="subtitle">
        Deep Learning-Based Coral Species Identification
    </div>


    <!-- MODEL STATUS -->

    <div id="status" class="status">
        Loading AI model...
    </div>


    <!-- IMAGE UPLOAD -->

    <div class="upload-section">

        <h3>Upload Coral Image</h3>

        <input
            type="file"
            id="imageInput"
            accept="image/*">

    </div>


    <!-- IMAGE PREVIEW -->

    <img
        id="preview"
        alt="Coral image preview">


    <!-- LOADING -->

    <div id="loading" class="loading">
        Processing image...
    </div>


    <!-- PREDICT BUTTON -->

    <div class="button-container">

        <button
            id="predictButton"
            disabled>

            PREDICT CORAL SPECIES

        </button>

    </div>


    <!-- RESULT -->

    <div id="result" class="result">

        <div class="result-title">
            Prediction Result
        </div>

        <p style="text-align:center;">
            Loading AI model...
        </p>

    </div>


    <!-- MODEL INFORMATION -->

    <div id="modelInfo" class="model-info">

        <strong>Model:</strong>
        Loading...

    </div>


    <div class="footer">
        Coral Species Classification AI
    </div>

</div>


<script>

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let model = null;

let labels = [];

let modelLoaded = false;

let inputHeight = 256;

let inputWidth = 256;

let inputChannels = 3;


/* =========================================================
   FILE PATHS
========================================================= */

/*
    ALL FILES ARE IN THE MAIN FOLDER:

    project/
    |
    |-- index.html
    |-- model.json
    |-- group1-shard1of1.bin
    |-- labels.json

*/

const modelURL = "./model.json";

const labelsURL = "./labels.json";


/* =========================================================
   HTML ELEMENTS
========================================================= */

const statusElement =
    document.getElementById("status");

const resultElement =
    document.getElementById("result");

const modelInfoElement =
    document.getElementById("modelInfo");

const predictButton =
    document.getElementById("predictButton");

const loadingElement =
    document.getElementById("loading");

const imageInput =
    document.getElementById("imageInput");

const preview =
    document.getElementById("preview");


/* =========================================================
   STATUS
========================================================= */

function setStatus(message, type = "") {

    statusElement.textContent = message;

    statusElement.className =
        "status " + type;

}


/* =========================================================
   LOAD LABELS
========================================================= */

async function loadLabels() {

    const response =
        await fetch(
            labelsURL,
            {
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "Cannot find labels.json. HTTP Status: " +
            response.status
        );

    }


    const data =
        await response.json();


    /*
        Supports:

        [
            "Species 1",
            "Species 2"
        ]

        OR

        {
            "0": "Species 1",
            "1": "Species 2"
        }
    */

    if (Array.isArray(data)) {

        labels = data;

    }

    else if (
        data &&
        typeof data === "object"
    ) {

        labels =
            Object.keys(data)
                .sort(
                    (a, b) =>
                        Number(a) - Number(b)
                )
                .map(
                    key => data[key]
                );

    }

    else {

        throw new Error(
            "Invalid labels.json format."
        );

    }


    console.log(
        "Labels loaded:",
        labels
    );

}


/* =========================================================
   LOAD MODEL
========================================================= */

async function loadModel() {

    try {

        console.log(
            "================================"
        );

        console.log(
            "CORAL MODEL LOADING"
        );

        console.log(
            "================================"
        );


        /* -----------------------------------------
           TensorFlow.js
        ----------------------------------------- */

        console.log(
            "TensorFlow.js:",
            tf.version.tfjs
        );


        /* -----------------------------------------
           CHECK MODEL.JSON
        ----------------------------------------- */

        setStatus(
            "Checking model.json..."
        );


        const response =
            await fetch(
                modelURL,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "model.json cannot be found. " +
                "HTTP Status: " +
                response.status
            );

        }


        const modelJSON =
            await response.json();


        console.log(
            "Model format:",
            modelJSON.format
        );


        /*
            Your model.json says:

            "format": "layers-model"

            Therefore:

            tf.loadLayersModel()
        */

        if (
            modelJSON.format !==
            "layers-model"
        ) {

            throw new Error(
                "Expected a LayersModel but model.json format is: " +
                modelJSON.format
            );

        }


        /* -----------------------------------------
           LOAD MODEL
        ----------------------------------------- */

        setStatus(
            "Loading AI model..."
        );


        model =
            await tf.loadLayersModel(
                modelURL
            );


        console.log(
            "MODEL LOADED SUCCESSFULLY"
        );


        /* -----------------------------------------
           MODEL INPUT
        ----------------------------------------- */

        const inputShape =
            model.inputs[0].shape;


        console.log(
            "Input shape:",
            inputShape
        );


        if (
            inputShape &&
            inputShape.length === 4
        ) {

            inputHeight =
                inputShape[1];

            inputWidth =
                inputShape[2];

            inputChannels =
                inputShape[3];

        }


        /* -----------------------------------------
           MODEL OUTPUT
        ----------------------------------------- */

        const outputShape =
            model.outputs[0].shape;


        console.log(
            "Output shape:",
            outputShape
        );


        const numberOfClasses =
            outputShape[
                outputShape.length - 1
            ];


        console.log(
            "Number of classes:",
            numberOfClasses
        );


        /* -----------------------------------------
           LOAD LABELS
        ----------------------------------------- */

        setStatus(
            "Loading coral species labels..."
        );


        await loadLabels();


        /* -----------------------------------------
           CHECK LABEL COUNT
        ----------------------------------------- */

        if (
            labels.length !==
            numberOfClasses
        ) {

            console.warn(
                "WARNING: labels count does not match model classes."
            );

            console.warn(
                "Labels:",
                labels.length
            );

            console.warn(
                "Classes:",
                numberOfClasses
            );

        }


        /* -----------------------------------------
           MODEL INFORMATION
        ----------------------------------------- */

        modelInfoElement.innerHTML = `

            <strong>Model:</strong>
            Optimized Coral CNN

            <br><br>

            <strong>Model Type:</strong>
            TensorFlow.js LayersModel

            <br><br>

            <strong>Input Size:</strong>
            ${inputWidth} × ${inputHeight} × ${inputChannels}

            <br><br>

            <strong>Output Classes:</strong>
            ${numberOfClasses}

            <br><br>

            <strong>Labels:</strong>
            ${labels.length}

        `;


        /* -----------------------------------------
           READY
        ----------------------------------------- */

        modelLoaded = true;

        predictButton.disabled = false;


        setStatus(
            "✓ AI Model Loaded Successfully",
            "success"
        );


        resultElement.innerHTML = `

            <div class="result-title">
                Prediction Result
            </div>

            <p style="text-align:center;">
                Upload a coral image to begin classification.
            </p>

        `;


        console.log(
            "================================"
        );

        console.log(
            "MODEL READY"
        );

        console.log(
            "================================"
        );

    }

    catch (error) {

        modelLoaded = false;

        predictButton.disabled = true;


        console.error(
            "MODEL LOADING ERROR:"
        );

        console.error(error);


        setStatus(
            "✗ AI Model Failed to Load",
            "error"
        );


        resultElement.innerHTML = `

            <div class="error-box">

                <strong>
                    Model Loading Error
                </strong>

                <br><br>

                ${escapeHTML(
                    error.message
                )}

                <br><br>

                <strong>
                    Check your files:
                </strong>

                <ul>

                    <li>
                        index.html
                    </li>

                    <li>
                        model.json
                    </li>

                    <li>
                        group1-shard1of1.bin
                    </li>

                    <li>
                        labels.json
                    </li>

                </ul>

                <p>
                    Open
                    <strong>F12 → Console</strong>
                    to see the complete error.
                </p>

            </div>

        `;


        modelInfoElement.innerHTML = `

            <strong>
                Model Status:
            </strong>

            Failed to load.

            <br><br>

            <strong>
                Error:
            </strong>

            ${escapeHTML(
                error.message
            )}

        `;

    }

}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

imageInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];


        if (!file) {

            preview.style.display =
                "none";

            return;

        }


        if (
            !file.type.startsWith("image/")
        ) {

            alert(
                "Please select an image."
            );

            imageInput.value = "";

            return;

        }


        const imageURL =
            URL.createObjectURL(file);


        preview.src =
            imageURL;


        preview.onload =
            function() {

                URL.revokeObjectURL(
                    imageURL
                );

            };


        preview.style.display =
            "block";


        resultElement.innerHTML = `

            <div class="result-title">
                Image Ready
            </div>

            <p style="text-align:center;">
                Click
                <strong>
                    PREDICT CORAL SPECIES
                </strong>
                to classify the image.
            </p>

        `;

    }
);


/* =========================================================
   PREDICT BUTTON
========================================================= */

predictButton.addEventListener(
    "click",
    predict
);


/* =========================================================
   PREDICT
========================================================= */

async function predict() {

    if (
        !modelLoaded ||
        !model
    ) {

        alert(
            "AI model is not ready."
        );

        return;

    }


    const file =
        imageInput.files[0];


    if (!file) {

        alert(
            "Please upload a coral image first."
        );

        return;

    }


    predictButton.disabled =
        true;

    loadingElement.style.display =
        "block";


    let tensor = null;

    let prediction = null;


    const startTime =
        performance.now();


    try {

        /* -----------------------------------------
           IMAGE → TENSOR
        ----------------------------------------- */

        tensor =
            tf.browser.fromPixels(
                preview
            );


        console.log(
            "Original tensor:",
            tensor.shape
        );


        /* -----------------------------------------
           RESIZE
        ----------------------------------------- */

        tensor =
            tf.image.resizeBilinear(
                tensor,
                [
                    inputHeight,
                    inputWidth
                ]
            );


        /* -----------------------------------------
           FLOAT
        ----------------------------------------- */

        tensor =
            tensor.toFloat();


        /*
            IMPORTANT:

            DO NOT USE:

            tensor.div(255)

            because your model already has:

            Rescaling(1 / 255)

        */


        /* -----------------------------------------
           BATCH DIMENSION
        ----------------------------------------- */

        tensor =
            tensor.expandDims(0);


        console.log(
            "Final input tensor:",
            tensor.shape
        );


        /* -----------------------------------------
           PREDICT
        ----------------------------------------- */

        prediction =
            model.predict(
                tensor
            );


        console.log(
            "Prediction:",
            prediction
        );


        /* -----------------------------------------
           GET PROBABILITIES
        ----------------------------------------- */

        const probabilities =
            await prediction.data();


        console.log(
            "Probabilities:",
            probabilities
        );


        /* -----------------------------------------
           FIND TOP CLASS
        ----------------------------------------- */

        let maxIndex = 0;


        for (
            let i = 1;
            i < probabilities.length;
            i++
        ) {

            if (
                probabilities[i] >
                probabilities[maxIndex]
            ) {

                maxIndex = i;

            }

        }


        const predictedSpecies =
            labels[maxIndex] ||
            "Unknown Species";


        const confidence =
            probabilities[maxIndex] *
            100;


        /* -----------------------------------------
           TOP 3
        ----------------------------------------- */

        const topIndices =
            Array.from(
                probabilities.keys()
            )
            .sort(
                (a, b) =>
                    probabilities[b] -
                    probabilities[a]
            )
            .slice(
                0,
                Math.min(
                    3,
                    probabilities.length
                )
            );


        let top3HTML = "";


        topIndices.forEach(
            (index, position) => {

                const percentage =
                    probabilities[index] *
                    100;


                top3HTML += `

                    <div class="prediction-row">

                        <span>
                            <strong>
                                ${position + 1}.
                            </strong>

                            ${escapeHTML(
                                labels[index] ||
                                "Unknown"
                            )}

                        </span>

                        <strong>
                            ${percentage.toFixed(2)}%
                        </strong>

                    </div>

                `;

            }
        );


        /* -----------------------------------------
           TIME
        ----------------------------------------- */

        const inferenceTime =
            performance.now() -
            startTime;


        /* -----------------------------------------
           DISPLAY
        ----------------------------------------- */

        resultElement.innerHTML = `

            <div class="result-title">
                Predicted Coral Species
            </div>


            <div class="species">

                ${escapeHTML(
                    predictedSpecies
                )}

            </div>


            <div class="confidence">

                Confidence:

                <strong>
                    ${confidence.toFixed(2)}%
                </strong>

            </div>


            <div class="top3">

                <h3>
                    Top 3 Predictions
                </h3>

                ${top3HTML}


                <hr>


                <p>

                    <strong>
                        Inference Time:
                    </strong>

                    ${inferenceTime.toFixed(2)}
                    ms

                </p>


                <p>

                    <strong>
                        Input:
                    </strong>

                    ${inputWidth}
                    ×
                    ${inputHeight}
                    ×
                    ${inputChannels}

                </p>


                <p>

                    <strong>
                        Classes:
                    </strong>

                    ${probabilities.length}

                </p>

            </div>

        `;


        console.log(
            "Predicted:",
            predictedSpecies
        );

        console.log(
            "Confidence:",
            confidence.toFixed(2) + "%"
        );

        console.log(
            "Inference:",
            inferenceTime.toFixed(2) + " ms"
        );

    }

    catch (error) {

        console.error(
            "PREDICTION ERROR:",
            error
        );


        resultElement.innerHTML = `

            <div class="error-box">

                <strong>
                    Prediction Error
                </strong>

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

    finally {

        if (tensor) {

            tensor.dispose();

        }


        if (
            prediction &&
            typeof prediction.dispose ===
            "function"
        ) {

            prediction.dispose();

        }


        loadingElement.style.display =
            "none";


        predictButton.disabled =
            !modelLoaded;

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   START
========================================================= */

loadModel();

</script>

</body>

</html>
