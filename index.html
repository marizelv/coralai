<script>
// ============================================================
// CORAL SPECIES CLASSIFICATION
// RESEARCH-ALIGNED PREDICTION PIPELINE
//
// ORIGINAL IMAGE
//      ↓
// 256 × 256 RGB
//      ↓
// /255.0
//      ↓
// ENHANCED CNN
//      ↓
// 14 RAW OUTPUTS
//      ↓
// PROBABILITY DETECTION
//      ↓
// TEMPERATURE SCALING
//      ↓
// SOFTMAX
//      ↓
// MAXIMUM CONFIDENCE
//      ↓
// ┌───────────────┬────────────────────┐
// │ >= 95%        │ < 95%              │
// │ CORAL SPECIES │ REJECTED / UNKNOWN │
// └───────────────┴────────────────────┘
// ============================================================


// ============================================================
// 1. SETTINGS
// ============================================================

const IMAGE_SIZE = 256;
const NUM_CHANNELS = 3;

// IMPORTANT:
// Your research requires a 95% rejection threshold.
const CONFIDENCE_THRESHOLD = 0.95;

// Temperature scaling.
// T = 1.0 means no additional calibration.
// Change this only if you have a validated calibration value.
const TEMPERATURE = 1.0;

const REJECTION_CLASS = "REJECTED / UNKNOWN";


// ============================================================
// 2. MODEL VARIABLES
// ============================================================

let tfliteModel = null;
let labels = [];


// ============================================================
// 3. LOAD LABELS
// ============================================================

async function loadLabels(file) {

    try {

        const text = await file.text();

        const parsed = JSON.parse(text);

        if (Array.isArray(parsed)) {
            labels = parsed;
        }

        else if (Array.isArray(parsed.labels)) {
            labels = parsed.labels;
        }

        else {
            throw new Error(
                "labels.json must contain an array of class labels."
            );
        }

        console.log("========================================");
        console.log("LABELS LOADED");
        console.log("Number of classes:", labels.length);
        console.log("Labels:", labels);
        console.log("========================================");

        if (labels.length !== 14) {

            console.warn(
                "Expected 14 classes, but found:",
                labels.length
            );
        }

        return true;

    } catch (error) {

        console.error("LABEL LOADING ERROR:", error);

        throw new Error(
            "Unable to load labels.json: " + error.message
        );
    }
}


// ============================================================
// 4. LOAD TFLITE MODEL
// ============================================================

async function loadTFLiteModel(file) {

    try {

        console.log("Loading TFLite model...");

        const modelBuffer = await file.arrayBuffer();

        tfliteModel =
            await tflite.loadTFLiteModel(modelBuffer);

        console.log("========================================");
        console.log("TFLITE MODEL LOADED");
        console.log("Model:", file.name);
        console.log("========================================");

        return true;

    } catch (error) {

        console.error("TFLITE MODEL ERROR:", error);

        throw new Error(
            "Unable to load TFLite model: " +
            error.message
        );
    }
}


// ============================================================
// 5. IMAGE → 256 × 256 RGB → /255.0
// ============================================================

async function createCNNInput(imageFile) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () => {

            try {

                // --------------------------------------------
                // Create exactly 256 × 256 canvas
                // --------------------------------------------

                const canvas =
                    document.createElement("canvas");

                canvas.width = IMAGE_SIZE;
                canvas.height = IMAGE_SIZE;

                const ctx = canvas.getContext("2d", {
                    willReadFrequently: true
                });

                // --------------------------------------------
                // Draw ORIGINAL image
                // No segmentation
                // --------------------------------------------

                ctx.drawImage(
                    img,
                    0,
                    0,
                    IMAGE_SIZE,
                    IMAGE_SIZE
                );

                // --------------------------------------------
                // Get RGB pixels
                // --------------------------------------------

                const imageData =
                    ctx.getImageData(
                        0,
                        0,
                        IMAGE_SIZE,
                        IMAGE_SIZE
                    );

                const pixels = imageData.data;

                // --------------------------------------------
                // Tensor shape:
                //
                // [1, 256, 256, 3]
                // --------------------------------------------

                const inputValues =
                    new Float32Array(
                        IMAGE_SIZE *
                        IMAGE_SIZE *
                        NUM_CHANNELS
                    );

                let index = 0;

                let minValue = Infinity;
                let maxValue = -Infinity;

                for (
                    let y = 0;
                    y < IMAGE_SIZE;
                    y++
                ) {

                    for (
                        let x = 0;
                        x < IMAGE_SIZE;
                        x++
                    ) {

                        const pixelIndex =
                            (y * IMAGE_SIZE + x) * 4;

                        // ------------------------------------
                        // RGB
                        // Ignore Alpha channel
                        // ------------------------------------

                        const r =
                            pixels[pixelIndex];

                        const g =
                            pixels[pixelIndex + 1];

                        const b =
                            pixels[pixelIndex + 2];

                        // ------------------------------------
                        // NORMALIZATION
                        //
                        // Original: 0–255
                        // CNN input: 0–1
                        // ------------------------------------

                        const rn = r / 255.0;
                        const gn = g / 255.0;
                        const bn = b / 255.0;

                        inputValues[index++] = rn;
                        inputValues[index++] = gn;
                        inputValues[index++] = bn;

                        if (rn < minValue)
                            minValue = rn;

                        if (gn < minValue)
                            minValue = gn;

                        if (bn < minValue)
                            minValue = bn;

                        if (rn > maxValue)
                            maxValue = rn;

                        if (gn > maxValue)
                            maxValue = gn;

                        if (bn > maxValue)
                            maxValue = bn;
                    }
                }

                // --------------------------------------------
                // Create Tensor
                // --------------------------------------------

                const inputTensor =
                    tf.tensor4d(
                        inputValues,
                        [
                            1,
                            IMAGE_SIZE,
                            IMAGE_SIZE,
                            NUM_CHANNELS
                        ],
                        "float32"
                    );

                console.log("========================================");
                console.log("CNN INPUT CREATED");
                console.log("Shape:", inputTensor.shape);
                console.log("Dtype:", inputTensor.dtype);
                console.log("Minimum:", minValue);
                console.log("Maximum:", maxValue);
                console.log("Normalization: pixel / 255.0");
                console.log("========================================");

                resolve(inputTensor);

            } catch (error) {

                reject(error);
            }

        };

        img.onerror = () => {

            reject(
                new Error(
                    "Unable to read the coral image."
                )
            );
        };

        img.src =
            URL.createObjectURL(imageFile);
    });
}


// ============================================================
// 6. CHECK IF OUTPUT IS ALREADY PROBABILITIES
// ============================================================

function isProbabilityDistribution(values) {

    if (!values || values.length === 0) {
        return false;
    }

    let sum = 0;

    for (let i = 0; i < values.length; i++) {

        const value = values[i];

        if (!Number.isFinite(value)) {
            return false;
        }

        // Probability must be between 0 and 1
        if (value < 0 || value > 1) {
            return false;
        }

        sum += value;
    }

    // A probability distribution should sum approximately to 1.
    return Math.abs(sum - 1.0) < 0.01;
}


// ============================================================
// 7. STABLE SOFTMAX
// ============================================================

function softmaxWithTemperature(
    logits,
    temperature = 1.0
) {

    if (!Array.isArray(logits)) {

        logits = Array.from(logits);
    }

    if (temperature <= 0) {

        throw new Error(
            "Temperature must be greater than zero."
        );
    }

    // --------------------------------------------
    // Find maximum WITHOUT spread operator
    // --------------------------------------------

    let maxLogit = -Infinity;

    for (let i = 0; i < logits.length; i++) {

        if (logits[i] > maxLogit) {
            maxLogit = logits[i];
        }
    }

    // --------------------------------------------
    // Calculate exponentials
    // --------------------------------------------

    const exponentials =
        new Float64Array(logits.length);

    let sumExp = 0;

    for (let i = 0; i < logits.length; i++) {

        const scaled =
            (logits[i] - maxLogit) / temperature;

        const expValue =
            Math.exp(scaled);

        exponentials[i] = expValue;

        sumExp += expValue;
    }

    // --------------------------------------------
    // Normalize
    // --------------------------------------------

    const probabilities =
        new Array(logits.length);

    for (let i = 0; i < logits.length; i++) {

        probabilities[i] =
            exponentials[i] / sumExp;
    }

    return probabilities;
}


// ============================================================
// 8. CONVERT MODEL OUTPUT TO PROBABILITIES
// ============================================================

function convertOutputToProbabilities(
    rawOutput
) {

    const values =
        Array.from(rawOutput);

    if (values.length !== labels.length) {

        throw new Error(
            "Output class count (" +
            values.length +
            ") does not match labels (" +
            labels.length +
            ")."
        );
    }

    console.log(
        "Raw model output:",
        values
    );

    // --------------------------------------------
    // CASE 1:
    // Model already outputs probabilities
    // --------------------------------------------

    if (
        isProbabilityDistribution(values)
    ) {

        console.log(
            "Output type: PROBABILITIES"
        );

        return {
            probabilities: values,
            outputType: "probabilities"
        };
    }

    // --------------------------------------------
    // CASE 2:
    // Model outputs logits
    // --------------------------------------------

    console.log(
        "Output type: LOGITS"
    );

    console.log(
        "Temperature:",
        TEMPERATURE
    );

    const probabilities =
        softmaxWithTemperature(
            values,
            TEMPERATURE
        );

    return {
        probabilities: probabilities,
        outputType: "logits"
    };
}


// ============================================================
// 9. FIND MAXIMUM CONFIDENCE
// ============================================================

function findMaximumProbability(
    probabilities
) {

    let maxIndex = 0;
    let maxProbability = probabilities[0];

    for (
        let i = 1;
        i < probabilities.length;
        i++
    ) {

        if (
            probabilities[i] >
            maxProbability
        ) {

            maxProbability =
                probabilities[i];

            maxIndex = i;
        }
    }

    return {
        index: maxIndex,
        confidence: maxProbability
    };
}


// ============================================================
// 10. MAIN CNN PREDICTION
// ============================================================

async function predictCoral(imageFile) {

    let inputTensor = null;
    let outputTensor = null;

    try {

        // ====================================================
        // VALIDATION
        // ====================================================

        if (!tfliteModel) {

            throw new Error(
                "TFLite model has not been loaded."
            );
        }

        if (!labels || labels.length === 0) {

            throw new Error(
                "No class labels have been loaded."
            );
        }


        // ====================================================
        // STEP 1
        // ORIGINAL IMAGE
        // → 256 × 256 RGB
        // → /255.0
        // ====================================================

        console.log(
            "STEP 1: Creating CNN input..."
        );

        inputTensor =
            await createCNNInput(
                imageFile
            );


        // ====================================================
        // VERIFY INPUT
        // ====================================================

        if (
            inputTensor.shape[0] !== 1 ||
            inputTensor.shape[1] !== 256 ||
            inputTensor.shape[2] !== 256 ||
            inputTensor.shape[3] !== 3
        ) {

            throw new Error(
                "Invalid CNN input shape: " +
                JSON.stringify(
                    inputTensor.shape
                )
            );
        }


        // ====================================================
        // STEP 2
        // ENHANCED CNN
        // ====================================================

        console.log(
            "STEP 2: Running Enhanced CNN..."
        );

        const startTime =
            performance.now();


        outputTensor =
            await tfliteModel.predict(
                inputTensor
            );


        const endTime =
            performance.now();

        const inferenceTime =
            endTime - startTime;


        // ====================================================
        // STEP 3
        // READ OUTPUT
        // ====================================================

        console.log(
            "STEP 3: Reading CNN output..."
        );

        let rawOutput;

        if (
            outputTensor &&
            typeof outputTensor.data === "function"
        ) {

            rawOutput =
                await outputTensor.data();

        } else {

            rawOutput =
                outputTensor;
        }


        // ====================================================
        // STEP 4
        // PROBABILITY DETECTION
        // → TEMPERATURE SCALING
        // → SOFTMAX
        // ====================================================

        console.log(
            "STEP 4: Converting output..."
        );

        const converted =
            convertOutputToProbabilities(
                rawOutput
            );

        const probabilities =
            converted.probabilities;


        // ====================================================
        // STEP 5
        // MAXIMUM CONFIDENCE
        // ====================================================

        console.log(
            "STEP 5: Finding maximum confidence..."
        );

        const result =
            findMaximumProbability(
                probabilities
            );

        const maxIndex =
            result.index;

        const confidence =
            result.confidence;


        const cnnPredictedSpecies =
            labels[maxIndex];


        // ====================================================
        // STEP 6
        // 95% REJECTION RULE
        // ====================================================

        const accepted =
            confidence >=
            CONFIDENCE_THRESHOLD;


        const finalPrediction =
            accepted
                ? cnnPredictedSpecies
                : REJECTION_CLASS;


        // ====================================================
        // RESULT
        // ====================================================

        const predictionResult = {

            // CNN prediction before rejection
            cnnPredictedSpecies:
                cnnPredictedSpecies,

            // Final application prediction
            predictedSpecies:
                finalPrediction,

            // Confidence
            confidence:
                confidence,

            confidencePercent:
                confidence * 100,

            // Decision
            accepted:
                accepted,

            // Threshold
            threshold:
                CONFIDENCE_THRESHOLD,

            thresholdPercent:
                CONFIDENCE_THRESHOLD * 100,

            // Runtime
            inferenceTimeMs:
                inferenceTime,

            // Model output
            outputType:
                converted.outputType,

            // All class probabilities
            probabilities:
                probabilities,

            labels:
                labels
        };


        console.log(
            "========================================"
        );

        console.log(
            "PREDICTION RESULT"
        );

        console.log(
            "CNN prediction:",
            cnnPredictedSpecies
        );

        console.log(
            "Confidence:",
            (
                confidence * 100
            ).toFixed(2) + "%"
        );

        console.log(
            "Threshold:",
            (
                CONFIDENCE_THRESHOLD * 100
            ).toFixed(0) + "%"
        );

        console.log(
            "Final prediction:",
            finalPrediction
        );

        console.log(
            "Accepted:",
            accepted
        );

        console.log(
            "Inference:",
            inferenceTime.toFixed(2),
            "ms"
        );

        console.log(
            "========================================"
        );


        return predictionResult;


    } catch (error) {

        console.error(
            "========================================"
        );

        console.error(
            "PREDICTION ERROR"
        );

        console.error(
            error
        );

        console.error(
            error.stack
        );

        console.error(
            "========================================"
        );

        throw error;


    } finally {

        // ====================================================
        // CLEANUP
        // ====================================================

        if (
            inputTensor &&
            typeof inputTensor.dispose === "function"
        ) {

            inputTensor.dispose();
        }

        if (
            outputTensor &&
            typeof outputTensor.dispose === "function"
        ) {

            outputTensor.dispose();
        }
    }
}


// ============================================================
// 11. DISPLAY RESULT
// ============================================================

function displayPredictionResult(
    result
) {

    const confidence =
        result.confidencePercent;

    const confidenceText =
        confidence.toFixed(2) + "%";

    const accepted =
        result.accepted;


    // --------------------------------------------
    // Final prediction
    // --------------------------------------------

    document.getElementById(
        "predictedSpecies"
    ).textContent =
        result.predictedSpecies;


    // --------------------------------------------
    // Confidence
    // --------------------------------------------

    document.getElementById(
        "confidence"
    ).textContent =
        confidenceText;


    // --------------------------------------------
    // Inference time
    // --------------------------------------------

    document.getElementById(
        "inferenceTime"
    ).textContent =
        result.inferenceTimeMs.toFixed(2) +
        " ms";


    // --------------------------------------------
    // Acceptance status
    // --------------------------------------------

    const status =
        document.getElementById(
            "predictionStatus"
        );

    if (accepted) {

        status.textContent =
            "✓ Prediction Accepted";

        status.style.color =
            "#008000";

    } else {

        status.textContent =
            "✗ Rejected / Unknown";

        status.style.color =
            "#d00000";
    }


    // --------------------------------------------
    // Top predictions
    // --------------------------------------------

    displayTopPredictions(
        result.labels,
        result.probabilities
    );
}


// ============================================================
// 12. DISPLAY TOP PREDICTIONS
// ============================================================

function displayTopPredictions(
    classLabels,
    probabilities
) {

    const container =
        document.getElementById(
            "topPredictions"
        );

    container.innerHTML = "";


    const results = [];

    for (
        let i = 0;
        i < probabilities.length;
        i++
    ) {

        results.push({
            label: classLabels[i],
            probability: probabilities[i]
        });
    }


    // Sort without using spread
    results.sort(
        (a, b) =>
            b.probability -
            a.probability
    );


    const topN =
        Math.min(
            5,
            results.length
        );


    for (
        let i = 0;
        i < topN;
        i++
    ) {

        const item =
            results[i];


        const percentage =
            (
                item.probability * 100
            ).toFixed(2);


        const row =
            document.createElement(
                "div"
            );

        row.className =
            "prediction-row";


        row.innerHTML = `
            <div class="prediction-label">
                <span>${item.label}</span>
                <span>${percentage}%</span>
            </div>

            <div class="prediction-bar-background">
                <div
                    class="prediction-bar"
                    style="width:${percentage}%">
                </div>
            </div>
        `;


        container.appendChild(row);
    }
}


// ============================================================
// 13. RUN PREDICTION
// ============================================================

async function runCoralPrediction(
    imageFile
) {

    try {

        console.log(
            "Starting research-aligned prediction..."
        );


        const result =
            await predictCoral(
                imageFile
            );


        displayPredictionResult(
            result
        );


        return result;


    } catch (error) {

        const errorElement =
            document.getElementById(
                "predictionError"
            );


        if (errorElement) {

            errorElement.textContent =
                "Prediction Error: " +
                error.message;

            errorElement.style.display =
                "block";
        }


        console.error(
            "Prediction failed:",
            error
        );


        return null;
    }
}

</script>
